# channels/main.conf - blocks of the channel `main` (branch `main`, GENERATED, never commit on it).
#
# One block per line, in cherry-pick order:   <branch>  [<needs>]  [<check>]
#   <branch>  featureblock/<name> or PR/vicocz/<name>  (wip/* only in releases/* channels,
#             backlog/* never)
#   <needs>   `-` (default) = based on vicocz/default, or a branch listed EARLIER that this
#             block is stacked on
#   <check>   `test` (default) = run the unit tests after the block, `none` = skip
# `featureblock/workflows` is appended automatically as the LAST block - do not list it.

featureblock/generic-settings   -                               test
featureblock/usb-stick          featureblock/generic-settings   test
