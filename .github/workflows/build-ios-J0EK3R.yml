name: Release BrickController iOS J0EK3R

on:
  push:
    branches:
      - default
      - 'release/**'
    paths:
      - '.github/**/*ios.yml'
      - '*.props'
      - '*.slnx'
      - 'BrickController2/BrickController2/**'
      - 'BrickController2/BrickController2.iOS/**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BUILD_CONFIGURATION: 'Release'
  PROJECT_FOLDER: "BrickController2/BrickController2.iOS"
  TARGET_RUNTIME: 'ios-arm64'
  APP_ID: ${{ vars.APPLE_BUNDLE_ID || 'cz.vico.brickcontrollerlegacy' }}

jobs:
  build-ios:
    runs-on: macos-latest
    name: BrickController iOS Build

    steps:
    - name: Register log masks
      env:
        MASK_LIST: ${{ secrets.MASK_LIST }}
      run: |
        while IFS= read -r MASK; do
          [ -n "$MASK" ] && echo "::add-mask::$MASK"
        done <<< "$MASK_LIST"

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}
    - name: Setup MAUI
      id: setup-maui
      uses: ./.github/actions/setup-maui
      with:
        platform: ios

    - name: Setup Xcode
      uses: ./.github/actions/setup-xcode
      with:
        version: ${{ vars.XCODE_VERSION }}

    - name: Import Code-Signing Certificates
      uses: Apple-Actions/import-codesign-certs@v7
      with:
        p12-file-base64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}

    - name: Import provisioning profile      
      id: import-provisioning-profile
      run: |        
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

        echo "${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

        PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

        PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A 1 "<key>UUID</key>" | grep "<string>" | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
        echo "Using PROFILE_UUID=$PROFILE_UUID"

        if [ -z "$PROFILE_UUID" ]; then
          echo "ERROR: Failed to extract UUID from provisioning profile"
          exit 1
        fi        

        echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_OUTPUT

    # - name: Download Apple Provisioning Profiles
    #   uses: Apple-Actions/download-provisioning-profiles@v6
    #   with:
    #     bundle-id: ${{ env.APP_ID }}
    #     issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
    #     api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
    #     api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

    # - name: List Keychain Certificates
    #   run: security find-identity -v -p codesigning
            
    - name: Restore Dependencies
      run: dotnet restore ${{ env.PROJECT_FOLDER }}/BrickController2.iOS.csproj

    - name: Build MAUI iOS
      run: >-
        dotnet publish ${{ env.PROJECT_FOLDER }}/BrickController2.iOS.csproj
        --no-restore
        -c ${{ env.BUILD_CONFIGURATION }}
        -f ${{ steps.setup-maui.outputs.target-framework }}
        -r ${{ env.TARGET_RUNTIME }}
        -p:ApplicationId="${{ env.APP_ID }}"
        -p:ApplicationVersion="${{ github.run_number }}"
        -p:ArchiveOnBuild=true
        -p:CodesignKey="Apple Development"
        -p:CodesignProvision="${{ steps.import-provisioning-profile.outputs.PROFILE_UUID }}"
        -p:EnableAssemblyILStripping=false
        -p:EnableCodeSigning=true

    - name: List build output
      run: ls -R ${{ env.PROJECT_FOLDER }}/bin/${{env.BUILD_CONFIGURATION}}/${{ steps.setup-maui.outputs.target-framework }}/${{ env.TARGET_RUNTIME }}/publish/

    - name: Upload IOS Artifact
      uses: actions/upload-artifact@v7
      with:
        name: brickcontroller-ios-ci-build
        path: ${{ env.PROJECT_FOLDER }}/bin/${{env.BUILD_CONFIGURATION}}/${{ steps.setup-maui.outputs.target-framework }}/${{ env.TARGET_RUNTIME }}/publish/BrickController2.iOS.ipa
        retention-days: 14

  publish-release:
    needs: build-ios
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: macos-latest
    name: Publish iOS Release
    permissions:
      contents: write

    steps:
    - name: Download IOS Artifact
      uses: actions/download-artifact@v6
      with:
        name: brickcontroller-ios-ci-build
        path: ipa-artifacts

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ipa-artifacts/BrickController2.iOS.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # - name: Upload app to TestFlight
    #   uses: Apple-Actions/upload-testflight-build@v5
    #   with:
    #     app-path: 'ipa-artifacts/BrickController2.iOS.ipa'
    #     issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
    #     api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
    #     api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

